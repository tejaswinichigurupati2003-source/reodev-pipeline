{% extends "shell.html" %}
{% block title %}{{ title }}{% endblock %}
{% block crumb %}{{ title }}{% endblock %}
{% block content %}
<div class="head"><div><h1>{{ code }}: {{ title }}</h1><div class="sub">{{ message }}</div></div></div>
<div class="panel"><p>Where would you like to go?</p>
 <a class="btn primary" href="{{ url_for('board') }}">Back to the board</a>
 <a class="btn" href="{{ url_for('index') }}">Lead list</a>
 <a class="btn" href="javascript:history.back()">Go back</a></div>
{% endblock %}
